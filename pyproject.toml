[project]
name = "awesome-project"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.143.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.1.4",
]

[tool.fastapi]
entrypoint = "app.main:app"


[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
